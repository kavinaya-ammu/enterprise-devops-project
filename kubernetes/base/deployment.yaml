apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms-api
  namespace: enterprise-wms
  labels: { app: wms-api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: wms-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: wms-api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: wms-api
          image: enterprise-wms:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8085 }]
          envFrom: [{ configMapRef: { name: wms-config } }]
          env:
            - name: DB_URL
              valueFrom: { secretKeyRef: { name: wms-db, key: DB_URL, optional: true } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: wms-db, key: DB_USERNAME, optional: true } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: wms-db, key: DB_PASSWORD, optional: true } }
          startupProbe: { httpGet: { path: /actuator/health, port: http }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /actuator/health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: http }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
