apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-devops-app
  namespace: enterprise-devops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: enterprise-devops-app
  template:
    metadata:
      labels:
        app: enterprise-devops-app
    spec:
      containers:
        - name: enterprise-devops-app
          image: charles1984/enterprise-devops-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
