apiVersion: v1
kind: Service
metadata: { name: wms-api }
spec:
  selector: { app: wms-api }
  ports: [{ name: http, port: 8085, targetPort: http }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: wms-api }
spec:
  to: { kind: Service, name: wms-api }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
