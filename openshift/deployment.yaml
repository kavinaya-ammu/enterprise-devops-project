apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms-api
  labels: { app: wms-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: wms-api } }
  template:
    metadata: { labels: { app: wms-api } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: wms-api
          image: image-registry.openshift-image-registry.svc:5000/enterprise-wms/enterprise-wms:1.0.0
          ports: [{ containerPort: 8085, name: http }]
          env:
            - name: SERVER_PORT
              value: "8085"
          readinessProbe: { httpGet: { path: /actuator/health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: http }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
