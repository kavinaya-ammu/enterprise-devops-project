global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
  - job_name: wms-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['wms-api.enterprise-wms.svc.cluster.local:8085']
        labels: { environment: dev }
