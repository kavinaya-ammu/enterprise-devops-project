groups:
  - name: enterprise-wms-alerts
    rules:
      - alert: WmsMetricsTargetDown
        expr: up{job="wms-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: WMS metrics endpoint is unavailable
          description: Prometheus has been unable to scrape the WMS API for 2 minutes.
      - alert: WmsHighJvmMemory
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: JVM heap usage is above 85 percent
      - alert: WmsHighHttp5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: HTTP 5xx ratio exceeds 5 percent
